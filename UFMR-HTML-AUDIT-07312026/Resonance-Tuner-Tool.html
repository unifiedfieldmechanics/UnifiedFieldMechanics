<script>
(function() {
    const knob = document.getElementById('rt-knob');
    const container = document.getElementById('rt-dial-container');
    const indicator = document.getElementById('rt-indicator');
    
    const titleText = document.getElementById('rt-title');
    const subText = document.getElementById('rt-sub');
    
    const visLow = document.getElementById('rt-vis-low');
    const visMid = document.getElementById('rt-vis-mid');
    const visHigh = document.getElementById('rt-vis-high');
    const viewText = document.getElementById('rt-view-text');
    
    const viewport = document.getElementById('rt-viewport');

    let isDragging = false;
    let currentAngle = -135; // Start at min (-135 to 135 range = 270 total degrees)
    let currentBand = 0; // 0=Low, 1=Mid, 2=High
    
    // Config for states
    const states = [
        {
            title: "Impedance",
            sub: "Resistance / Frustration / Survival",
            text: "Reality reflects friction, scarcity, and conflict.",
            color: "#ff4a4a",
            vis: visLow,
            vpBorder: "#3a0a0a",
            vpShadow: "none"
        },
        {
            title: "Neutral",
            sub: "Neutral / Balanced",
            text: "Reality reflects predictable, linear, functional mechanics.",
            color: "#0096ff",
            vis: visMid,
            vpBorder: "#0a2033",
            vpShadow: "0 0 15px rgba(0, 150, 255, 0.2)"
        },
        {
            title: "Coherence",
            sub: "Aligned / Resourced / Grace",
            text: "Reality reflects synchronicity, limitless potential, and flow.",
            color: "#e8bf3c",
            vis: visHigh,
            vpBorder: "#b87333",
            vpShadow: "0 0 30px rgba(232, 191, 60, 0.5)"
        }
    ];

    function updateState(angle) {
        // Map angle (-135 to 135) to percentage (0 to 1)
        let pct = (angle + 135) / 270;
        
        let newBand = 0;
        if (pct > 0.33 && pct <= 0.66) newBand = 1;
        if (pct > 0.66) newBand = 2;
        
        if (newBand !== currentBand) {
            currentBand = newBand;
            renderBand();
        }
    }

    function renderBand() {
        const state = states[currentBand];
        
        // Update Text
        titleText.textContent = state.title;
        titleText.style.color = state.color;
        subText.textContent = state.sub;
        viewText.textContent = state.text;
        
        // Update Indicator Color
        indicator.style.background = state.color;
        indicator.style.boxShadow = `0 0 10px ${state.color}`;
        
        // Update Viewport Visuals
        visLow.classList.remove('rt-viewport-active');
        visMid.classList.remove('rt-viewport-active');
        visHigh.classList.remove('rt-viewport-active');
        
        state.vis.classList.add('rt-viewport-active');
        viewport.style.borderColor = state.vpBorder;
        viewport.style.boxShadow = state.vpShadow;
    }

    // Dial Interaction Logic
    function getAngle(e) {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = clientX - centerX;
        const y = clientY - centerY;
        
        // Calculate angle in degrees
        let rad = Math.atan2(y, x);
        let deg = rad * (180 / Math.PI);
        
        // Offset so 0 is top
        deg = deg + 90;
        if (deg > 180) deg -= 360;
        
        return deg;
    }

    function onMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        
        let deg = getAngle(e);
        
        // Constrain to -135 to 135 degrees
        if (deg > 135 && deg < 180) deg = 135;
        if (deg < -135 && deg > -180) deg = -135;
        // Handling the bottom gap (135 to 180 and -135 to -180)
        if (deg > 135) deg = 135;
        if (deg < -135) deg = -135;
        
        currentAngle = deg;
        knob.style.transform = `rotate(${currentAngle}deg)`;
        
        updateState(currentAngle);
    }

    function onDown(e) {
        isDragging = true;
        onMove(e);
    }

    function onUp() {
        isDragging = false;
    }

    // Attach listeners
    knob.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove, {passive: false});
    document.addEventListener('mouseup', onUp);
    
    knob.addEventListener('touchstart', onDown, {passive: false});
    document.addEventListener('touchmove', onMove, {passive: false});
    document.addEventListener('touchend', onUp);

    // Initial render
    renderBand();

})();
</script>
