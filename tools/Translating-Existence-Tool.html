    function updateParadigm() {
        populateConcepts();
        updateTranslations();
    }

    function populateConcepts() {
        const userParadigm = document.getElementById('user-paradigm').value;
        const conceptSelect = document.getElementById('concept-selector');
        const currentConceptId = conceptSelect.value;
        
        conceptSelect.innerHTML = '';
        
        dictionary.forEach(entry => {
            const option = document.createElement('option');
            option.value = entry.id;
            // Join the terms to show the user what they know the concept as
            option.textContent = entry.terms[userParadigm].join(" / ");
            conceptSelect.appendChild(option);
        });

        // Retain selection if valid
        if (currentConceptId && Array.from(conceptSelect.options).some(opt => opt.value === currentConceptId)) {
            conceptSelect.value = currentConceptId;
        }
    }

    function updateTranslations() {
        const userParadigm = document.getElementById('user-paradigm').value;
        const conceptId = document.getElementById('concept-selector').value;
        
        const conceptData = dictionary.find(c => c.id === conceptId);
        if (!conceptData) return;

        // Display Synthesis
        document.getElementById('synthesis-text').textContent = conceptData.definition;

        // Identify the two other paradigms
        const allKeys = Object.keys(paradigmLabels);
        const otherKeys = allKeys.filter(k => k !== userParadigm);

        // Update Card 1
        document.getElementById('card-1-title').textContent = paradigmLabels[otherKeys[0]];
        let html1 = '<ul>';
        conceptData.terms[otherKeys[0]].forEach(t => html1 += `<li>${t}</li>`);
        html1 += '</ul>';
        document.getElementById('card-1-content').innerHTML = html1;

        // Update Card 2
        document.getElementById('card-2-title').textContent = paradigmLabels[otherKeys[1]];
        let html2 = '<ul>';
        conceptData.terms[otherKeys[1]].forEach(t => html2 += `<li>${t}</li>`);
        html2 += '</ul>';
        document.getElementById('card-2-content').innerHTML = html2;
    }

    // Event Listeners
    document.getElementById('user-paradigm').addEventListener('change', updateParadigm);
    document.getElementById('concept-selector').addEventListener('change', updateTranslations);

    // Initial Load
    updateParadigm();

</script>
